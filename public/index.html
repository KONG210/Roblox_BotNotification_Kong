<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roblox Farm Dashboard</title><style>
:root{color-scheme:dark;font-family:system-ui,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;background:#0a1020;color:#edf3ff}main{max-width:1100px;margin:auto;padding:30px 18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:26px;margin:0}p,small{color:#9caec8}.status{border:1px solid #355e59;border-radius:99px;padding:8px 14px;color:#70e5b8}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:25px 0}.card,.panel{background:#151f33;border:1px solid #263650;border-radius:16px;padding:20px}.card span{color:#a8b8d1}.card strong{display:block;font-size:30px;margin-top:8px}.columns{display:grid;grid-template-columns:1fr 1.6fr;gap:16px}@media(max-width:750px){.columns{grid-template-columns:1fr}}h2{font-size:18px;margin:0 0 18px}.reward{display:flex;justify-content:space-between;border-bottom:1px solid #2c3950;padding:10px 0}.run{border-top:1px solid #2c3950;padding:14px 0}.run b{color:#fff}.win{color:#65e3a3}.loss{color:#ff8e9b}.meta{font-size:13px;color:#9caec8;margin-top:5px}.empty{color:#a9b7c9}button{background:#6878ff;border:0;border-radius:9px;padding:10px 14px;color:white;cursor:pointer}</style></head><body><main><header><div><h1>🎮 Roblox Farm Dashboard</h1><p>Discord webhook farm tracker · Live updates</p></div><div class="status" id="status">● Connecting</div></header><section class="cards"><div class="card"><span>Total Runs</span><strong id="total">—</strong></div><div class="card"><span>Victory</span><strong id="wins">—</strong></div><div class="card"><span>Defeat</span><strong id="losses">—</strong></div><div class="card"><span>Win Rate</span><strong id="rate">—</strong></div></section><p id="last">Loading reports…</p><section class="columns"><div class="panel"><h2>🎁 Total Rewards</h2><div id="rewards" class="empty">No rewards yet</div></div><div class="panel"><h2>📜 Recent Runs</h2><div id="runs" class="empty">No runs yet</div></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString();async function load(){try{const r=await fetch('/api/dashboard');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();$('total').textContent=fmt(d.stats.total);$('wins').textContent=fmt(d.stats.wins);$('losses').textContent=fmt(d.stats.losses);$('rate').textContent=d.stats.total?(d.stats.wins/d.stats.total*100).toFixed(1)+'%':'0%';$('last').textContent=d.lastReport?'Latest report: '+new Date(d.lastReport).toLocaleString('th-TH'):'Waiting for Discord farm results';$('rewards').innerHTML=Object.entries(d.totals).sort((a,b)=>b[1]-a[1]).map(([name,amount])=>`<div class="reward"><span>${escapeHTML(name)}</span><b>+${fmt(amount)}</b></div>`).join('')||'<p>No rewards yet</p>';$('runs').innerHTML=d.runs.map(x=>`<div class="run"><b>${escapeHTML(x.map)}</b> <span class="${x.result==='Victory'?'win':'loss'}">${escapeHTML(x.result)}</span><div class="meta">${new Date(x.created_at).toLocaleString('th-TH')} · ${escapeHTML(x.player||'Unknown player')} · Wave ${escapeHTML(x.wave??'?')} · ${escapeHTML(x.duration||'—')}</div><div class="meta">${(x.rewards||[]).map(r=>`+${fmt(r.amount)} ${escapeHTML(r.item)}`).join(' · ')}</div></div>`).join('')||'<p>No runs yet</p>';}catch(e){$('last').textContent='Failed to load: '+e.message;}}const socket=io();socket.on('connect',()=>{$('status').textContent='● Connected';load()});socket.on('disconnect',()=>{$('status').textContent='● Disconnected'});socket.on('updated',load);load();
</script></body></html>
